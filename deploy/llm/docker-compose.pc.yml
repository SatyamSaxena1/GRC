# Home / office PC variant of docker-compose.yml: no open ports, no card on
# file anywhere. Tailscale Funnel makes an OUTBOUND connection from this PC
# and serves https://<device>.<tailnet>.ts.net publicly — no port forwarding,
# no Cloudflare/AWS account, no payment method required on the free plan.
#
#   cp .env.example .env    # fill in
#   docker compose -f docker-compose.pc.yml up -d
#   docker compose -f docker-compose.pc.yml exec tailscale tailscale up --qr
#     # scan/open the printed URL once, sign in with an existing Google/
#     # Microsoft/GitHub account (no card asked) to join your tailnet
#   docker compose -f docker-compose.pc.yml exec tailscale tailscale funnel 80
#     # prints the public https://<device>.<tailnet>.ts.net URL — that is
#     # your OLLAMA_BASE_URL
#
# Windows: Docker Desktop (WSL2 backend) + current NVIDIA driver gives containers the GPU.

services:
  ollama:
    image: "ollama/ollama:${OLLAMA_VERSION:?pin an image tag in .env}"
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"   # 1 for a 12-16 GB card, 2 for 24 GB
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  model-pull:
    image: "ollama/ollama:${OLLAMA_VERSION}"
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: "${MODELS:?list the models to pull in .env}"
    entrypoint: ["/bin/sh", "-c", "for m in $$MODELS; do echo pulling $$m; ollama pull \"$$m\"; done"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:?generate one with openssl rand -hex 32}"
    volumes:
      - ./Caddyfile.pc:/etc/caddy/Caddyfile:ro
    network_mode: "service:tailscale"   # share tailscale's network namespace so
                                         # funnel can reach it on localhost:80

  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: grc-llm
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # No ports published — Tailscale Funnel reaches out to Tailscale's relay,
    # it does not need an inbound port on this host or your router.

volumes:
  ollama-models:
  tailscale-state:
