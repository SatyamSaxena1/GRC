- provision: eu-ai-act:art5.2
  ref: Art. 5(2)
  sha256: ef03f02f6e5f9ecdcce7d0f314e23821a754d34cb6eb185e94b9983f24d97228
  status: pending
  verdict_basis: documentable
  reason: The provision mandates specific conditions and authorizations for using real-time remote biometric
    identification systems, which can be documented through policies or records.
  new_artefact_types: []
  requirement:
    clause: Art. 5(2)
    title: Real-Time Remote Biometric Identification System Use Authorization
    text: '2. The use of ‘real-time’ remote biometric identification systems in publicly accessible spaces
      for the purposes of law enforcement for any of the objectives referred to in paragraph 1, first
      subparagraph, point (h), shall be deployed for the purposes set out in that point only to confirm
      the identity of the specifically targeted individual, and it shall take into account the following
      elements: (a) the nature of the situation giving rise to the possible use, in particular the seriousness,
      probability and scale of the harm that would be caused if the system were not used; (b) the consequences
      of the use of the system for the rights and freedoms of all persons concerned, in particular the
      seriousness, probability and scale of those consequences. In addition, the use of ‘real-time’ remote
      biometric identification systems in publicly accessible spaces for the purposes of law enforcement
      for any of the objectives referred to in paragraph 1, first subparagraph, point (h), of this Article
      shall comply with necessary and proportionate safeguards and conditions in relation to the use in
      accordance with the national law authorising the use thereof, in particular as regards the temporal,
      geographic and personal limitations. The use of the ‘real-time’ remote biometric identification
      system in publicly accessible spaces shall be authorised only if the law enforcement authority has
      completed a fundamental rights impact assessment as provided for in Article 27 and has registered
      the system in the EU database according to Article 49. However, in duly justified cases of urgency,
      the use of such systems may be commenced without the registration in the EU database, provided that
      such registration is completed without undue delay.'
    evidence_requirements:
    - artefact_type: AI_POLICY
      required_attributes:
      - biometric_system_use_scope
      - public_space_usage_restrictions
      - fundamental_rights_impact_assessment_completed
      - eu_database_registration_status
      evidence_validity: null
    mappings:
    - uco: UCO-AIGOV-006
      coverage: FULL
      confidence: 1.0
      source: AI
      delta_conditions: []
    guidance: Document the process by which authorization for using real-time remote biometric identification
      systems in public spaces is obtained, including evidence of fundamental rights impact assessments
      and registration status.
- provision: eu-ai-act:art5.3
  ref: Art. 5(3)
  sha256: e327079d5dc3e7c8e981109fcc1ced7b8b120479e8ca72666952a8fabdf05d46
  status: pending
  verdict_basis: documentable
  reason: The provision mandates specific conditions (necessity, proportionality, scope limitation) and
    procedural steps (prior authorization, handling rejection) that must be documented to prove compliance.
  new_artefact_types: []
  requirement:
    clause: Art. 5(3)
    title: Authorization for Real-Time Remote Biometric Identification Systems
    text: 3. For the purposes of paragraph 1, first subparagraph, point (h) and paragraph 2, each use
      for the purposes of law enforcement of a ‘real-time’ remote biometric identification system in publicly
      accessible spaces shall be subject to a prior authorisation granted by a judicial authority or an
      independent administrative authority whose decision is binding of the Member State in which the
      use is to take place, issued upon a reasoned request and in accordance with the detailed rules of
      national law referred to in paragraph 5. However, in a duly justified situation of urgency, the
      use of such system may be commenced without an authorisation provided that such authorisation is
      requested without undue delay, at the latest within 24 hours. If such authorisation is rejected,
      the use shall be stopped with immediate effect and all the data, as well as the results and outputs
      of that use shall be immediately discarded and deleted. The competent judicial authority or an independent
      administrative authority whose decision is binding shall grant the authorisation only where it is
      satisfied, on the basis of objective evidence or clear indications presented to it, that the use
      of the ‘real-time’ remote biometric identification system concerned is necessary for, and proportionate
      to, achieving one of the objectives specified in paragraph 1, first subparagraph, point (h), as
      identified in the request and, in particular, remains limited to what is strictly necessary concerning
      the period of time as well as the geographic and personal scope. In deciding on the request, that
      authority shall take into account the elements referred to in paragraph 2. No decision that produces
      an adverse legal effect on a person may be taken based solely on the output of the ‘real-time’ remote
      biometric identification system.
    evidence_requirements:
    - artefact_type: POLICY
      required_attributes:
      - biometric_system_authorization_process_documented
      - necessity_and_proportionality_assessment_required
      evidence_validity: null
    mappings:
    - uco: UCO-AIGOV-002
      coverage: FULL
      confidence: 1.0
      source: AI
      delta_conditions: []
    guidance: Document the process by which prior judicial or independent administrative authorization
      is obtained, detailing the justification of necessity and proportionality, and outlining immediate
      actions upon rejection.
