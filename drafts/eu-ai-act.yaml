- provision: eu-ai-act:art27.1
  ref: Art. 27(1)
  sha256: 7f57ae668096f45727273bd98935f95404c7f146b2fcdeda409375b574c6c7bd
  status: pending
  verdict_basis: documentable
  reason: The provision requires a deployer to perform an impact assessment that mandates documenting
    several specific details about the system's use, which can be captured in policy or report artifacts.
  new_artefact_types: []
  requirement:
    clause: Art. 27(1)
    title: High-Risk AI Impact Assessment Documentation
    text: '1. Prior to deploying a high-risk AI system referred to in Article 6(2), with the exception
      of high-risk AI systems intended to be used in the area listed in point 2 of Annex III, deployers
      that are bodies governed by public law, or are private entities providing public services, and deployers
      of high-risk AI systems referred to in points 5 (b) and (c) of Annex III, shall perform an assessment
      of the impact on fundamental rights that the use of such system may produce. For that purpose, deployers
      shall perform an assessment consisting of: (a) a description of the deployer’s processes in which
      the high-risk AI system will be used in line with its intended purpose; (b) a description of the
      period of time within which, and the frequency with which, each high-risk AI system is intended
      to be used; (c) the categories of natural persons and groups likely to be affected by its use in
      the specific context; (d) the specific risks of harm likely to have an impact on the categories
      of natural persons or groups of persons identified pursuant to point (c) of this paragraph, taking
      into account the information given by the provider pursuant to Article 13; (e) a description of
      the implementation of human oversight measures, according to the instructions for use; (f) the measures
      to be taken in the case of the materialisation of those risks, including the arrangements for internal
      governance and complaint mechanisms.'
    evidence_requirements:
    - artefact_type: REPORT
      required_attributes:
      - system_description_of_use
      - intended_usage_period
      - intended_usage_frequency
      - affected_person_categories
      - specific_risks_of_harm
      - human_oversight_implementation
      - risk_mitigation_measures
      evidence_validity: null
    mappings:
    - uco: UCO-AIGOV-001
      coverage: FULL
      confidence: 0.9
      source: AI
      delta_conditions: []
    - uco: UCO-AIGOV-004
      coverage: FULL
      confidence: 0.95
      source: AI
      delta_conditions:
      - attribute: human_oversight_implementation
        operator: ==
        value: true
    - uco: UCO-AIGOV-003
      coverage: PARTIAL
      confidence: 0.85
      source: AI
      delta_conditions: []
    guidance: The document must detail the intended use processes, usage frequency/period, affected groups,
      specific risks of harm, human oversight implementation, and risk mitigation measures including governance
      and complaints.
