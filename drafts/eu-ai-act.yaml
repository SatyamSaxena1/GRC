    text: 10. Without prejudice to Directive (EU) 2016/680, in the framework of an investigation for the
      targeted search of a person suspected or convicted of having committed a criminal offence, the deployer
      of a high-risk AI system for post-remote biometric identification shall request an authorisation,
      ex ante, or without undue delay and no later than 48 hours, by a judicial authority or an administrative
      authority whose decision is binding and subject to judicial review, for the use of that system,
      except when it is used for the initial identification of a potential suspect based on objective
      and verifiable facts directly linked to the offence. Each use shall be limited to what is strictly
      necessary for the investigation of a specific criminal offence. If the authorisation requested pursuant
      to the first subparagraph is rejected, the use of the post-remote biometric identification system
      linked to that requested authorisation shall be stopped with immediate effect and the personal data
      linked to the use of the high-risk AI system for which the authorisation was requested shall be
      deleted. In no case shall such high-risk AI system for post-remote biometric identification be used
      for law enforcement purposes in an untargeted way, without any link to a criminal offence, a criminal
      proceeding, a genuine and present or genuine and foreseeable threat of a criminal offence, or the
      search for a specific missing person. It shall be ensured that no decision that produces an adverse
      legal effect on a person may be taken by the law enforcement authorities based solely on the output
      of such post-remote biometric identification systems. This paragraph is without prejudice to Article
      9 of Regulation (EU) 2016/679 and Article 10 of Directive (EU) 2016/680 for the processing of biometric
      data. Regardless of the purpose or deployer, each use of such high-risk AI systems shall be documented
      in the relevant police file and shall be made available to the relevant market surveillance authority
      and the national data protection authority upon request, excluding the disclosure of sensitive operational
      data related to law enforcement. This subparagraph shall be without prejudice to the powers conferred
      by Directive (EU) 2016/680 on supervisory authorities. Deployers shall submit annual reports to
      the relevant market surveillance and national data protection authorities on their use of post-remote
      biometric identification systems, excluding the disclosure of sensitive operational data related
      to law enforcement. The reports may be aggregated to cover more than one deployment. Member States
      may introduce, in accordance with Union law, more restrictive laws on the use of post-remote biometric
      identification systems.
    evidence_requirements:
    - artefact_type: REPORT
      required_attributes:
      - ai_system_used
      - use_date
      - purpose_of_use
      - authorisation_status
      - data_deleted_if_rejected
      evidence_validity: null
    mappings:
    - uco: UCO-AIGOV-001
      coverage: FULL
      confidence: 0.9
      source: AI
      delta_conditions: []
    - uco: UCO-LOG-001
      coverage: SUPPORTING
      confidence: 0.85
      source: AI
      delta_conditions: []
    guidance: Maintain a record detailing every instance where a high-risk AI system for post-remote biometric
      identification is used, ensuring this documentation can be provided to relevant market surveillance
      and national data protection authorities upon request.
