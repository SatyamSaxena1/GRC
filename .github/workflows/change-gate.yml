# The change-control gate on this repository itself (ADR-024), in warn-only mode: it reports
# whether each pull request would pass the audit's per-merge rules, without blocking it.
# Expect warnings while one person reviews everything; that is the finding, honestly stated.
name: change-control gate

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: change-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: change-control gate
    runs-on: ubuntu-latest
    steps:
      # The gate's own code comes from the base branch, never from the pull request it judges:
      # otherwise a PR could edit the gate to pass itself.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      # Only the pull request that introduces the gate can find it missing on its base. Say so
      # and pass; missing for any other reason (say, deleted from the base) is a failure.
      - name: Is the gate on the base branch?
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -f .github/actions/change-control-gate/action.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          added=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
            | python3 -c "import json,sys; print(any(f['filename']=='.github/actions/change-control-gate/action.yml' and f['status']=='added' for f in json.load(sys.stdin)))")
          if [ "$added" = "True" ]; then
            echo "::warning::This pull request introduces the change-control gate; it runs from the base branch on later pull requests."
            echo "present=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::The change-control gate is missing from the base branch."
          exit 4
      - if: steps.base.outputs.present == 'true'
        uses: ./.github/actions/change-control-gate
        with:
          frameworks: SOC-2 ISO-27001 PCI-DSS
          warn-only: "true"
