name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Row-level security on real Postgres. The backend job runs on SQLite, where every
  # set_tenant/set_firm call is a no-op, so tenant isolation was never tested there
  # (ADR-019 rule 1). The app connects as a role that is neither superuser nor BYPASSRLS:
  # superusers skip every policy, and tests/test_rls_postgres.py fails if run as one.
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RLS_TEST_DATABASE_URL: postgresql+psycopg://grc_app:grc_app@localhost:5432/grc_rls
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Create the application role and its database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE grc_app LOGIN PASSWORD 'grc_app' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE DATABASE grc_rls OWNER grc_app"
      - name: RLS tests (a skip here means nothing was proven, so it fails the job)
        run: |
          python -m pytest -q -rs tests/test_rls_postgres.py | tee rls.out
          ! grep -qi "skipped" rls.out

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Render never auto-deployed this repo (every deploy up to 2026-09-28 was
  # `api` or `blueprint_sync`, none from a push): its GitHub App isn't
  # connected, so it never hears about pushes. A deploy hook fired from here
  # fixes that *and* only ships a main commit whose tests passed.
  # Needs repo secret RENDER_DEPLOY_HOOK_URL (Render → grc → Settings →
  # Deploy Hook). The URL is itself the credential: anyone with it can deploy.
  deploy:
    needs: [backend, frontend, rls]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: render-deploy
    steps:
      - name: Trigger Render deploy (grc)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set, so this commit was not deployed"
            exit 0
          fi
          # The hook URL already carries ?key=…, so ref joins with & — and
          # pins the deploy to the exact commit that just passed.
          case "$HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -X POST "${HOOK}${sep}ref=${GITHUB_SHA}" -o /dev/null
          echo "Render deploy requested for $GITHUB_SHA"

      # grc-demo (grc-demo-vu2u.onrender.com) is the public demo; it has auto-deploy off and,
      # like grc, Render's GitHub App never hears about pushes, so it deploys from here too,
      # on the same green, RLS-gated commit.
      - name: Trigger Render deploy (grc-demo)
        env:
          HOOK: ${{ secrets.RENDER_DEMO_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEMO_DEPLOY_HOOK_URL secret is not set, so grc-demo was not deployed"
            exit 0
          fi
          case "$HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -X POST "${HOOK}${sep}ref=${GITHUB_SHA}" -o /dev/null
          echo "Render deploy requested for grc-demo at $GITHUB_SHA"
