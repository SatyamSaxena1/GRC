# Free-tier stand-in for Render cron jobs (see render.yaml "Free-tier limits").
# Runs the same two app.monitor modes DEPLOYMENT.md documents for a VM/cron
# setup, on GitHub's own schedule instead of Render's. Needs one repo secret:
# DATABASE_URL — the grc-db connection string from the Render dashboard
# (Settings on the render.yaml file — no, from the grc-db service page).
# When you move off the free tier, delete this file and use the two Render
# cron services in the paid render.yaml instead.
name: DPDP monitor

on:
  schedule:
    - cron: "0 */6 * * *"   # sync connectors, every 6 hours (UTC)
    - cron: "30 1 * * *"    # daily attention report, 07:00 IST
  workflow_dispatch:        # manual "Run workflow" button for testing

jobs:
  sync-connectors:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m app.monitor --sync-connectors
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  daily-report:
    if: github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m app.monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
