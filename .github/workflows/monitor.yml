# Free-tier stand-in for Render cron jobs (see render.yaml "Free-tier limits").
# Runs the same two app.monitor modes DEPLOYMENT.md documents for a VM/cron
# setup, on GitHub's own schedule instead of Render's. Needs one repo secret:
# DATABASE_URL — the *External* Database URL from the grc-db service page on
# Render (runners are outside Render's private network). Optional, per source:
# DPDP_<SOURCE>_COLLECTOR_URL / _TOKEN — a source without a URL is skipped. Syncing
# also needs S3_BUCKET, S3_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (as in
# Render's grc-secrets group), so snapshots land where the web service reads them.
# When you move off the free tier, delete this file and use the two Render
# cron services in the paid render.yaml instead.
#
# daily-report exits 1 whenever something needs a human (app/monitor.py,
# ADR-006) — a red run there can be the alert working, not a broken job.
name: DPDP monitor

on:
  schedule:
    - cron: "0 */6 * * *"   # sync connectors, every 6 hours (UTC)
    - cron: "30 1 * * *"    # daily attention report, 07:00 IST
  workflow_dispatch:        # manual "Run workflow" button for testing

jobs:
  sync-connectors:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Secrets go on the steps that need them, not the job: `pip install` runs
    # third-party build code and has no business seeing the DB password.
    steps:
      - name: Require DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::DATABASE_URL secret is not set — add the grc-db External Database URL (gh secret set DATABASE_URL)"; exit 1; }
      - name: Warn when no collector is configured; fail when there is nowhere to store
        env:
          ANY_COLLECTOR: ${{ secrets.DPDP_AWS_COLLECTOR_URL }}${{ secrets.DPDP_M365_COLLECTOR_URL }}${{ secrets.DPDP_GOOGLE_WORKSPACE_COLLECTOR_URL }}${{ secrets.DPDP_HRMS_COLLECTOR_URL }}${{ secrets.DPDP_GITHUB_COLLECTOR_URL }}${{ secrets.DPDP_GITLAB_COLLECTOR_URL }}${{ secrets.DPDP_BITBUCKET_COLLECTOR_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [ -z "$ANY_COLLECTOR" ]; then
            echo "::warning::No DPDP_*_COLLECTOR_URL secret is set, so there is nothing to sync"
          elif [ -z "$S3_BUCKET" ]; then
            # Without the production bucket the snapshot would land on this runner's disk and
            # vanish with it, while the database points at it: a green run that kept nothing.
            echo "::error::S3_BUCKET (and S3_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) must be repo secrets, copied from Render's grc-secrets group"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m app.monitor --sync-connectors
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DPDP_AWS_COLLECTOR_URL: ${{ secrets.DPDP_AWS_COLLECTOR_URL }}
          DPDP_AWS_COLLECTOR_TOKEN: ${{ secrets.DPDP_AWS_COLLECTOR_TOKEN }}
          DPDP_M365_COLLECTOR_URL: ${{ secrets.DPDP_M365_COLLECTOR_URL }}
          DPDP_M365_COLLECTOR_TOKEN: ${{ secrets.DPDP_M365_COLLECTOR_TOKEN }}
          DPDP_GOOGLE_WORKSPACE_COLLECTOR_URL: ${{ secrets.DPDP_GOOGLE_WORKSPACE_COLLECTOR_URL }}
          DPDP_GOOGLE_WORKSPACE_COLLECTOR_TOKEN: ${{ secrets.DPDP_GOOGLE_WORKSPACE_COLLECTOR_TOKEN }}
          DPDP_HRMS_COLLECTOR_URL: ${{ secrets.DPDP_HRMS_COLLECTOR_URL }}
          DPDP_HRMS_COLLECTOR_TOKEN: ${{ secrets.DPDP_HRMS_COLLECTOR_TOKEN }}
          # Change-control sources (ADR-020)
          DPDP_GITHUB_COLLECTOR_URL: ${{ secrets.DPDP_GITHUB_COLLECTOR_URL }}
          DPDP_GITHUB_COLLECTOR_TOKEN: ${{ secrets.DPDP_GITHUB_COLLECTOR_TOKEN }}
          DPDP_GITLAB_COLLECTOR_URL: ${{ secrets.DPDP_GITLAB_COLLECTOR_URL }}
          DPDP_GITLAB_COLLECTOR_TOKEN: ${{ secrets.DPDP_GITLAB_COLLECTOR_TOKEN }}
          DPDP_BITBUCKET_COLLECTOR_URL: ${{ secrets.DPDP_BITBUCKET_COLLECTOR_URL }}
          DPDP_BITBUCKET_COLLECTOR_TOKEN: ${{ secrets.DPDP_BITBUCKET_COLLECTOR_TOKEN }}
          # The same object storage the web service reads, so stored snapshots are viewable
          STORAGE_BACKEND: s3
          AWS_REGION: ap-northeast-1
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  daily-report:
    if: github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::DATABASE_URL secret is not set — add the grc-db External Database URL (gh secret set DATABASE_URL)"; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m app.monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
