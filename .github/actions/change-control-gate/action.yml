name: Change-control gate
description: >
  Run the audit's own change-control rules (SOC 2 CC8.1, ISO 27001 A.8.32, PCI DSS 6.5.1) on this
  pull request before it merges. Read-only: needs contents, pull-requests and checks read access.
inputs:
  frameworks:
    description: Space-separated frameworks to judge against (SOC-2, ISO-27001, PCI-DSS).
    default: SOC-2
  warn-only:
    description: "'true' reports gaps without failing (for rollout). A gate that cannot run still fails."
    default: "false"
  self-check:
    description: The check name this gate runs under, so it does not wait for itself.
    default: change-control gate
  wait-seconds:
    description: How long to wait for the pull request's other checks to finish.
    default: "600"
  token:
    description: Token to read the pull request with.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install the gate (rules and content packs only)
      shell: bash
      run: |
        python -m pip install --quiet --no-deps "$GITHUB_ACTION_PATH/../../.."
        python -m pip install --quiet pyyaml "pydantic>=2" requests
    - name: Judge this pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        FRAMEWORKS: ${{ inputs.frameworks }}
        WARN_ONLY: ${{ inputs.warn-only }}
        SELF_CHECK: ${{ inputs.self-check }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
      run: |
        pr="$PR_NUMBER"
        if [ -z "$pr" ] && [ -n "$MERGE_GROUP_REF" ]; then
          # gh-readonly-queue/<base>/pr-<number>-<sha>
          pr="$(printf '%s' "$MERGE_GROUP_REF" | sed -n 's|.*/pr-\([0-9][0-9]*\)-.*|\1|p')"
        fi
        if [ -z "$pr" ]; then
          echo "::error::change-control gate: run it on pull_request, pull_request_review or merge_group events"
          exit 4
        fi
        args=(--repo "$GITHUB_REPOSITORY" --pr "$pr" --self-check "$SELF_CHECK" --wait "$WAIT_SECONDS")
        for f in $FRAMEWORKS; do args+=(--framework "$f"); done
        if [ "$WARN_ONLY" = "true" ]; then args+=(--warn-only); fi
        python -m app.change_gate "${args[@]}"
