# Local development infrastructure only. Ollama stays on the host: it already
# runs there, and containerizing it would mean either losing GPU access or
# pinning a CUDA image for no benefit at this stage.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: grc
      POSTGRES_DB: grc
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./scripts/db-init:/docker-entrypoint-initdb.d"  # creates the authentik database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Real identity provider (see docs/adr/011-oidc-auth.md). Optional for local
  # dev — the app's stub auth path works with neither this nor OIDC_* env vars
  # set. Bring up with: docker compose up -d postgres authentik-server authentik-worker
  # then complete first-run setup at http://localhost:9002/if/flow/initial-setup/
  # and create an OAuth2/OIDC provider + application for this app's frontend.
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: "change-me-before-any-shared-or-production-use"
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: grc
      AUTHENTIK_POSTGRESQL__PASSWORD: grc
      AUTHENTIK_POSTGRESQL__NAME: authentik
    ports: ["9002:9000"]
    depends_on: {postgres: {condition: service_healthy}}

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: "change-me-before-any-shared-or-production-use"
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: grc
      AUTHENTIK_POSTGRESQL__PASSWORD: grc
      AUTHENTIK_POSTGRESQL__NAME: authentik
    depends_on: {postgres: {condition: service_healthy}}

  createbuckets:
    image: minio/mc:latest
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/grc-evidence &&
      mc version enable local/grc-evidence
      "

volumes:
  pgdata:
  miniodata:
