# Render Blueprint — FREE-TIER PILOT (no card on file). See "Free-tier limits"
# below for what this gives up versus the paid Path C in DEPLOYMENT.md.
# The LLM does NOT run on Render (no GPUs) — see deploy/llm/.
#
# Before the first apply, create an environment group named `grc-secrets` in the
# Render dashboard (Environment Groups) holding the values that must never be
# committed:
#   ADMIN_API_KEY        operator key for the /admin/* bootstrap routes
#   S3_BUCKET, S3_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   OIDC_ISSUER, OIDC_AUDIENCE, OIDC_JWKS_URL
#   OIDC_EMAIL_CLAIM     only if the IdP namespaces it (Auth0: https://grc-api/email)
#   OLLAMA_BASE_URL, OLLAMA_API_KEY   (the GPU host from deploy/llm/)
#   optional: CISO_ASSISTANT_*, DPDP_*_COLLECTOR_URL / _TOKEN
#   DATABASE_URL is NOT set here — the web service below gets it directly from
#   grc-db (fromDatabase), which overrides any placeholder in the group.
#
# One web instance only: SSE and upload background tasks are in-process
# (app/events.py), so do not raise numInstances or enable autoscaling.
#
# --- Free-tier limits (read before relying on this for real customers) -----
# - Web service sleeps after 15 min idle; the next request wakes it (~30-60s).
# - Free Postgres is deleted 30 days after creation unless upgraded — put a
#   calendar reminder, or take a manual pg_dump backup before then.
# - No preDeployCommand on the free plan, so migrations run at container start
#   (RUN_MIGRATIONS defaults to 1 — see docker/entrypoint.sh) using the same
#   DATABASE_URL as the app. There is no separate owner/grc_app split; the
#   default Render database user is not a superuser and has no BYPASSRLS, so
#   the FORCE ROW LEVEL SECURITY migrations still apply to it — verify this
#   with the RLS check in DEPLOYMENT.md before trusting it with real tenants.
# - No Render cron jobs on the free plan: .github/workflows/monitor.yml runs
#   the two `python -m app.monitor` modes on a schedule instead, connecting
#   directly to DATABASE_URL from a GitHub Actions runner.
# - Upgrade path: raise `plan:` on the db and web service, add back
#   preDeployCommand + MIGRATION_DATABASE_URL + the grc_app role (see
#   DEPLOYMENT.md Path C), and delete the GitHub Actions monitor workflow in
#   favor of Render cron jobs.

databases:
  - name: grc-db
    databaseName: grc
    user: grc_owner
    plan: free
    postgresMajorVersion: "16"
    region: singapore

envVarGroups:
  - name: grc-config
    envVars:
      - key: AUTH_STUB_ENABLED
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: AWS_REGION
        value: ap-northeast-1        # Supabase Storage S3 (Tokyo); R2 would use "auto"
      - key: OLLAMA_MODEL
        value: qwen2.5vl:7b
      - key: OLLAMA_VISION_MODEL
        value: qwen2.5vl:7b
      - key: OLLAMA_TIMEOUT_S
        value: "180"
      - key: VLM_RENDER_DPI
        value: "200"
      - key: MALWARE_SCANNER
        value: noop                  # clamav needs its own clamd service

services:
  - type: web
    name: grc
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: grc-db
          property: connectionString
      # Public SPA login settings, inlined into the frontend at Docker build time
      # (Dockerfile ARGs). Auth0: https://<tenant>/authorize, /oauth/token, SPA client id.
      - key: VITE_OIDC_AUTHORIZE_URL
        sync: false
      - key: VITE_OIDC_TOKEN_URL
        sync: false
      - key: VITE_OIDC_CLIENT_ID
        sync: false
      - fromGroup: grc-config
      - fromGroup: grc-secrets
