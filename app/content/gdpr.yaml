framework:
  code: GDPR
  version: "2016/679"

# EU General Data Protection Regulation (Regulation (EU) 2016/679, public
# legal text). Article references are the regulation's own citations. Several
# technical thresholds below (review cadence, scan cadence) are our own
# reasonable baseline where the article states a principle rather than a
# number — flagged where it applies.
requirements:
  - clause: "Art.5(1)(f) & 32"
    title: Access is restricted to authorised persons
    text: >
      Personal data is processed in a manner that ensures appropriate security,
      including protection against unauthorised access, through a documented
      access control policy.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [approval_date, approver_role, effective_date, systems_covered]
        evidence_validity:
          expiry_attribute: next_review_date
          issued_attribute: approval_date
          max_age_days: 365
          required: false
    mappings:
      - uco: UCO-IAM-001
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions: []
      - uco: UCO-IAM-002
        coverage: SUPPORTING
        confidence: 0.9
        source: EXPERT
        delta_conditions: []

  - clause: "Art.32(1)"
    title: Authentication appropriate to risk
    text: >
      Access to systems processing personal data is authenticated using measures
      appropriate to the risk, including multi-factor authentication for remote
      and administrative access.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [mfa_required_for]
    mappings:
      # Art.32 is risk-based and does not name MFA explicitly; this is our own
      # reasonable implementation of "appropriate technical measures".
      - uco: UCO-IAM-012
        coverage: FULL
        confidence: 0.7
        source: EXPERT
        delta_conditions:
          - attribute: mfa_required_for
            operator: contains_all
            value: ["remote access", "administrative access"]

  - clause: "Art.32(4)"
    title: Access is limited to what is necessary
    text: >
      Any person acting under the controller's authority who has access to personal
      data only processes it on instruction, and access is reviewed to stay limited
      to what is necessary.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [access_review_frequency_days]
      # The org's own stated cadence is the yardstick — see
      # docs/adr/013-organization-defined-commitments.md.
      - artefact_type: REVIEW_RECORD
        required_attributes: [last_access_review_date]
        evidence_validity:
          issued_attribute: last_access_review_date
          org_defined_max_age_attribute: access_review_frequency_days
          required: true
    mappings:
      - uco: UCO-IAM-020
        coverage: FULL
        confidence: 0.8
        source: EXPERT
        delta_conditions: []

  - clause: "Art.32(1)(a)"
    title: Pseudonymisation and encryption of personal data
    text: >
      Personal data is protected using encryption, both at rest and in transit,
      as an appropriate technical measure.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [encryption_at_rest, encryption_in_transit]
    mappings:
      - uco: UCO-DATA-001
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions:
          - attribute: encryption_at_rest
            operator: "=="
            value: true
          - attribute: encryption_in_transit
            operator: "=="
            value: true

  - clause: "Art.32(1)(d)"
    title: Regular testing of security measures
    text: >
      A process for regularly testing, assessing and evaluating the effectiveness of
      technical security measures is in place, including vulnerability scanning.
    evidence_requirements:
      - artefact_type: SCAN_REPORT
        required_attributes:
          [scan_completed_date, scan_expiry_date, compliance_status, asv_company]
        evidence_validity:
          expiry_attribute: scan_expiry_date
          issued_attribute: scan_completed_date
          # Art.32 says "regularly" without a number; annual is our own baseline,
          # looser than PCI/CIS's explicit quarterly cadence.
          max_age_days: 365
    mappings:
      - uco: UCO-VULN-001
        coverage: FULL
        confidence: 0.7
        source: EXPERT
        delta_conditions:
          - attribute: compliance_status
            operator: "=="
            value: true
