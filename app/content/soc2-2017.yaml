framework:
  code: SOC-2
  version: "2017"

# AICPA Trust Services Criteria, Security category ("Common Criteria"). Clause
# ids are the standard CC-series references; descriptions below are our own
# paraphrase, not quoted from the licensed criteria text.
requirements:
  - clause: "CC6.1"
    title: Logical access security policy
    text: >
      A logical access security policy defines how access to systems, data and other
      protected assets is authorized and restricted based on job role.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [approval_date, approver_role, effective_date, systems_covered]
        evidence_validity:
          expiry_attribute: next_review_date
          issued_attribute: approval_date
          max_age_days: 365
          required: false
    mappings:
      - uco: UCO-IAM-001
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions: []
      - uco: UCO-IAM-002
        coverage: SUPPORTING
        confidence: 0.9
        source: EXPERT
        delta_conditions: []

  - clause: "CC6.2"
    title: Credential management
    text: >
      Credentials used to authenticate users meet a minimum strength standard before
      access is granted.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [password_min_length]
    mappings:
      - uco: UCO-IAM-011
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions:
          - attribute: password_min_length
            operator: ">="
            value: 12

  - clause: "CC6.6"
    title: Multi-factor authentication
    text: >
      Multi-factor authentication protects remote access and administrative access to
      in-scope systems.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [mfa_required_for]
    mappings:
      - uco: UCO-IAM-012
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions:
          - attribute: mfa_required_for
            operator: contains_all
            value: ["remote access", "administrative access"]

  - clause: "CC6.3"
    title: Periodic access review
    text: >
      User access rights are reviewed on a recurring basis to confirm they remain
      appropriate to the user's current role.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [access_review_frequency_days]
      # The org's own stated cadence is the yardstick — see
      # docs/adr/013-organization-defined-commitments.md.
      - artefact_type: REVIEW_RECORD
        required_attributes: [last_access_review_date]
        evidence_validity:
          issued_attribute: last_access_review_date
          org_defined_max_age_attribute: access_review_frequency_days
          required: true
    mappings:
      - uco: UCO-IAM-020
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions: []

  - clause: "CC6.7"
    title: Protection of data in transit and at rest
    text: >
      Data is protected using encryption both while stored and while transmitted over
      untrusted networks.
    evidence_requirements:
      - artefact_type: ENCRYPTION_POLICY
        required_attributes: [encryption_at_rest, encryption_in_transit]
    mappings:
      - uco: UCO-DATA-001
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions:
          - attribute: encryption_at_rest
            operator: "=="
            value: true
          - attribute: encryption_in_transit
            operator: "=="
            value: true

  - clause: "CC7.1"
    title: Vulnerability detection
    text: >
      The system is monitored for vulnerabilities through recurring scanning, and
      findings are tracked to resolution.
    evidence_requirements:
      - artefact_type: SCAN_REPORT
        required_attributes:
          [scan_completed_date, scan_expiry_date, compliance_status, asv_company]
        evidence_validity:
          expiry_attribute: scan_expiry_date
          issued_attribute: scan_completed_date
          max_age_days: 90
    mappings:
      - uco: UCO-VULN-001
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions:
          - attribute: compliance_status
            operator: "=="
            value: true

  # Evidenced by a GitHub change-control snapshot (ADR-020). "Independent approval" and
  # "no bypass" are our reading of authorized-and-approved; thresholds are our own baseline.
  - clause: "CC8.1"
    title: Change management
    text: >
      Changes to infrastructure, data and software are authorized, tested, approved and implemented under a defined process before they reach production.
    evidence_requirements:
      - artefact_type: CHANGE_CONTROL_SNAPSHOT
        required_attributes: [repositories_in_scope, default_branch_protected, required_approving_reviews,
                              stale_reviews_dismissed, admins_can_bypass, force_push_allowed_on_default,
                              merges_in_period, merges_without_independent_approval,
                              merges_with_failing_or_missing_checks, direct_pushes_to_default,
                              ai_assisted_merges, ai_assisted_merges_without_independent_approval,
                              gate_path_merges, gate_path_merges_without_two_independent_approvals,
                              production_deployments, deployments_not_from_default_branch,
                              deployments_of_unreviewed_changes]
    mappings:
      - uco: UCO-CHG-001
        coverage: FULL
        confidence: 0.8
        source: EXPERT
        delta_conditions:
          - {attribute: default_branch_protected, operator: "==", value: true}
          - {attribute: required_approving_reviews, operator: ">=", value: 1}
          - {attribute: merges_without_independent_approval, operator: "==", value: 0}
          - {attribute: merges_with_failing_or_missing_checks, operator: "==", value: 0}
          - {attribute: direct_pushes_to_default, operator: "==", value: 0}
          - {attribute: ai_assisted_merges_without_independent_approval, operator: "==", value: 0}
          # What ran in production must be what was approved (ADR-020, deploy reconciliation).
          - {attribute: deployments_not_from_default_branch, operator: "==", value: 0}
          - {attribute: deployments_of_unreviewed_changes, operator: "==", value: 0}
      - uco: UCO-CHG-002
        coverage: FULL
        confidence: 0.8
        source: EXPERT
        delta_conditions:
          - {attribute: force_push_allowed_on_default, operator: "==", value: false}
          - {attribute: admins_can_bypass, operator: "==", value: false}
          - {attribute: stale_reviews_dismissed, operator: "==", value: true}
          # Our baseline: a change to CI, tests or ownership can weaken every later check,
          # so it needs two independent approvals (ADR-019 rule 2, ADR-020).
          - {attribute: gate_path_merges_without_two_independent_approvals, operator: "==", value: 0}

  # Evidenced by a connector snapshot, not a document: the same facts DPDP reads from AWS. The
  # mapping is our reading of the clause, with a stated baseline (ADR-037).
  - clause: "CC7.2"
    title: Monitoring of system components
    text: >
      The entity monitors system components and the operation of those components for anomalies that are indicative of malicious acts, natural disasters and errors affecting the entity's ability to meet its objectives.
    evidence_requirements:
      - artefact_type: AWS_SNAPSHOT
        required_attributes: [access_logging_enabled]
    mappings:
      - uco: UCO-LOG-001
        coverage: PARTIAL
        confidence: 0.6
        source: EXPERT
        delta_conditions:
          - {attribute: access_logging_enabled, operator: "==", value: true}

  # DRAFT, awaiting human review (issue 82). Drafted by an AI from the public criteria titles, so the mappings
  # below say source: AI, not EXPERT. They reuse existing unified controls and policy attributes; nothing here
  # needs new rules. Clauses that need a NEW unified control (CC6.4 physical access, CC6.8 malicious software,
  # CC7.5 recovery, CC9.x) are deliberately not drafted yet.
  - clause: "CC6.5"
    title: Disposal of data and assets
    text: >
      The entity discontinues logical and physical protections over assets only after the ability to read or recover
      data and software from those assets has been diminished, through a defined retention and disposal process.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [data_retention_schedule, erasure_process]
    mappings:
      - uco: UCO-PRIV-002
        coverage: PARTIAL
        confidence: 0.6
        source: AI
        delta_conditions: []

  - clause: "CC7.3"
    title: Security events are evaluated
    text: >
      The entity evaluates security events to determine whether they could or have resulted in a failure to meet its
      objectives, and if so, takes action to prevent or address such failures.
    evidence_requirements:
      - artefact_type: AWS_SNAPSHOT
        required_attributes: [access_logging_enabled]
    mappings:
      - uco: UCO-LOG-001
        coverage: SUPPORTING
        confidence: 0.5
        source: AI
        delta_conditions:
          - {attribute: access_logging_enabled, operator: "==", value: true}

  - clause: "CC7.4"
    title: Incident response
    text: >
      The entity responds to identified security incidents by executing a defined incident response programme to
      understand, contain, remediate and communicate security incidents, as appropriate.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [data_breach_response_process, board_notification_hours, affected_person_notification]
    mappings:
      - uco: UCO-PRIV-003
        coverage: PARTIAL
        confidence: 0.6
        source: AI
        delta_conditions:
          - {attribute: affected_person_notification, operator: "==", value: true}
