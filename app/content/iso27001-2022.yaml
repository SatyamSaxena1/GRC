framework:
  code: ISO-27001
  version: "2022"

requirements:
  - clause: "A.5.15"
    title: Access control
    text: >
      Rules to control physical and logical access to information and other associated
      assets shall be established and implemented based on business and information
      security requirements.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [approval_date, approver_role, effective_date, systems_covered]
        # ISO expects topic-specific policies to be reviewed at planned intervals.
        # Absent a stated review date, treat an approval older than a year as stale.
        evidence_validity:
          expiry_attribute: next_review_date
          issued_attribute: approval_date
          max_age_days: 365
          required: false
    mappings:
      - uco: UCO-IAM-001
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions: []
      - uco: UCO-IAM-002
        coverage: SUPPORTING
        confidence: 0.9
        source: EXPERT
        delta_conditions: []

  - clause: "A.5.17"
    title: Authentication information
    text: >
      Allocation and management of authentication information shall be controlled by a
      management process, including advising personnel on appropriate handling.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [password_min_length]
    mappings:
      - uco: UCO-IAM-011
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions:
          - attribute: password_min_length
            operator: ">="
            value: 8

  - clause: "A.5.18"
    title: Access rights
    text: >
      Access rights to information and other associated assets shall be provisioned,
      reviewed, modified and removed in accordance with the topic-specific policy on
      access control.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [access_review_frequency_days]
      # The org's own stated cadence is the yardstick — see
      # docs/adr/013-organization-defined-commitments.md.
      - artefact_type: REVIEW_RECORD
        required_attributes: [last_access_review_date]
        evidence_validity:
          issued_attribute: last_access_review_date
          org_defined_max_age_attribute: access_review_frequency_days
          required: true
    mappings:
      - uco: UCO-IAM-020
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions: []

  # Evidenced by a GitHub change-control snapshot (ADR-020). ISO states the outcome, not
  # the mechanism: gate hardening beyond force-push is SUPPORTING here, a baseline of ours.
  - clause: "A.8.32"
    title: Change management
    text: >
      Changes to information processing facilities and systems follow change management procedures.
    evidence_requirements:
      - artefact_type: CHANGE_CONTROL_SNAPSHOT
        required_attributes: [repositories_in_scope, default_branch_protected, required_approving_reviews,
                              stale_reviews_dismissed, admins_can_bypass, force_push_allowed_on_default,
                              merges_in_period, merges_without_independent_approval,
                              merges_with_failing_or_missing_checks, direct_pushes_to_default,
                              ai_assisted_merges, ai_assisted_merges_without_independent_approval,
                              gate_path_merges, gate_path_merges_without_two_independent_approvals,
                              production_deployments, deployments_not_from_default_branch,
                              deployments_of_unreviewed_changes]
    mappings:
      - uco: UCO-CHG-001
        coverage: FULL
        confidence: 0.8
        source: EXPERT
        delta_conditions:
          - {attribute: default_branch_protected, operator: "==", value: true}
          - {attribute: required_approving_reviews, operator: ">=", value: 1}
          - {attribute: merges_without_independent_approval, operator: "==", value: 0}
          - {attribute: merges_with_failing_or_missing_checks, operator: "==", value: 0}
          - {attribute: direct_pushes_to_default, operator: "==", value: 0}
          - {attribute: ai_assisted_merges_without_independent_approval, operator: "==", value: 0}
          # What ran in production must be what was approved (ADR-020, deploy reconciliation).
          - {attribute: deployments_not_from_default_branch, operator: "==", value: 0}
          - {attribute: deployments_of_unreviewed_changes, operator: "==", value: 0}
      - uco: UCO-CHG-002
        coverage: SUPPORTING
        confidence: 0.8
        source: EXPERT
        delta_conditions:
          - {attribute: force_push_allowed_on_default, operator: "==", value: false}

  # Evidenced by a certificate key-health snapshot (app/collectors/weak_keys.py). A.8.24 asks
  # for far more than key strength, so this is SUPPORTING evidence: a guessable key opens a
  # gap on the clause, but a clean snapshot alone never proves it (the verdict stays PARTIAL).
  - clause: "A.8.24"
    title: Use of cryptography
    text: >
      Rules for the effective use of cryptography, including cryptographic key management, are defined and implemented.
    evidence_requirements:
      - artefact_type: KEY_HEALTH_SNAPSHOT
        required_attributes: [certificates_in_scope, weak_ec_keys, weak_rsa_keys, short_rsa_keys, duplicate_public_keys,
                              full_corpus_checked]
    mappings:
      - uco: UCO-CRY-001
        coverage: SUPPORTING
        confidence: 0.6
        source: EXPERT
        delta_conditions:
          - {attribute: certificates_in_scope, operator: ">=", value: 1}
          - {attribute: weak_ec_keys, operator: "==", value: 0}
          - {attribute: weak_rsa_keys, operator: "==", value: 0}
          - {attribute: short_rsa_keys, operator: "==", value: 0}
          - {attribute: duplicate_public_keys, operator: "==", value: 0}
          # The cheap built-in checks are not the full weak-key corpus: say so when it did not run.
          - {attribute: full_corpus_checked, operator: "==", value: true}

  # Evidenced by a connector snapshot, not a document: the same facts DPDP reads from Microsoft 365. The
  # mapping is our reading of the clause, with a stated baseline (ADR-037).
  - clause: "A.8.5"
    title: Secure authentication
    text: >
      Secure authentication technologies and procedures are implemented based on access restrictions.
    evidence_requirements:
      - artefact_type: M365_SNAPSHOT
        required_attributes: [privileged_access_mfa]
    mappings:
      - uco: UCO-IAM-012
        coverage: FULL
        confidence: 0.7
        source: EXPERT
        delta_conditions:
          - {attribute: privileged_access_mfa, operator: "==", value: true}

  # Evidenced by a connector snapshot, not a document: the same facts DPDP reads from AWS. The
  # mapping is our reading of the clause, with a stated baseline (ADR-037).
  - clause: "A.8.2"
    title: Privileged access rights
    text: >
      The allocation and use of privileged access rights is restricted and managed.
    evidence_requirements:
      - artefact_type: AWS_SNAPSHOT
        required_attributes: [privileged_access_mfa]
    mappings:
      - uco: UCO-IAM-012
        coverage: PARTIAL
        confidence: 0.6
        source: EXPERT
        delta_conditions:
          - {attribute: privileged_access_mfa, operator: "==", value: true}

  # Evidenced by a connector snapshot, not a document: the same facts DPDP reads from AWS. The
  # mapping is our reading of the clause, with a stated baseline (ADR-037).
  - clause: "A.8.15"
    title: Logging
    text: >
      Logs that record activities, exceptions, faults and other relevant events are produced, stored, protected and analysed.
    evidence_requirements:
      - artefact_type: AWS_SNAPSHOT
        required_attributes: [access_logging_enabled]
    mappings:
      - uco: UCO-LOG-001
        coverage: PARTIAL
        confidence: 0.6
        source: EXPERT
        delta_conditions:
          - {attribute: access_logging_enabled, operator: "==", value: true}

  # DRAFT, awaiting human review (issue 82). Drafted by an AI from the public control title, so the mapping says
  # source: AI, not EXPERT. It reads a connector snapshot and reuses an existing unified control and attribute.
  # Deliberately not drafted: A.5.26 incident response and A.8.10 deletion (a POLICY clause asks every uploaded policy
  # for incident and retention facts, so an access-control policy would start failing ISO), A.8.13 backup and A.8.20
  # network security (they need a NEW unified control), A.6.5 (documented duties, which a leaver count cannot show: ADR-037).

  # Evidenced by a connector snapshot, not a document: the same facts as A.8.15, read as monitoring.
  - clause: "A.8.16"
    title: Monitoring activities
    text: >
      Networks, systems and applications shall be monitored for anomalous behaviour and appropriate actions taken to
      evaluate potential information security incidents.
    evidence_requirements:
      - artefact_type: AWS_SNAPSHOT
        required_attributes: [access_logging_enabled]
    mappings:
      - uco: UCO-LOG-001
        coverage: SUPPORTING
        confidence: 0.5
        source: AI
        delta_conditions:
          - {attribute: access_logging_enabled, operator: "==", value: true}

  # DRAFT, awaiting human review (issue 82). Drafted by an AI from the public control titles, so each mapping says
  # source: AI, not EXPERT. A.5.26 and A.8.10 read their own kinds of policy (INCIDENT_POLICY, RETENTION_POLICY), so an
  # access-control policy is never asked for incident or retention facts. A.8.13 reads the AWS snapshot.
  - clause: "A.5.26"
    title: Response to information security incidents
    text: >
      Information security incidents shall be responded to in accordance with the documented procedures.
    evidence_requirements:
      - artefact_type: INCIDENT_POLICY
        required_attributes: [data_breach_response_process, board_notification_hours, affected_person_notification]
    mappings:
      - uco: UCO-PRIV-003
        coverage: PARTIAL
        confidence: 0.6
        source: AI
        delta_conditions:
          - {attribute: affected_person_notification, operator: "==", value: true}

  - clause: "A.8.10"
    title: Information deletion
    text: >
      Information stored in information systems, devices or in any other storage media shall be deleted when no
      longer required.
    evidence_requirements:
      - artefact_type: RETENTION_POLICY
        required_attributes: [data_retention_schedule, erasure_process]
    mappings:
      - uco: UCO-PRIV-002
        coverage: PARTIAL
        confidence: 0.6
        source: AI
        delta_conditions: []

  # Evidenced by a connector snapshot, not a document. AWS shows that backups exist, not that a restore works.
  - clause: "A.8.13"
    title: Information backup
    text: >
      Backup copies of information, software and systems shall be maintained and regularly tested in accordance with
      the agreed topic-specific policy on backup.
    evidence_requirements:
      - artefact_type: AWS_SNAPSHOT
        required_attributes: [backup_enabled]
    mappings:
      - uco: UCO-DATA-002
        coverage: PARTIAL
        confidence: 0.5
        source: AI
        delta_conditions:
          - {attribute: backup_enabled, operator: "==", value: true}

# ---------------------------------------------------------------------------
# Attested clauses (ADR-060): no rule judges these yet. No evidence is matched against
# them; a person states the control is in place, with a date and optional proof, and the
# clause reads ATTESTED, never PASS. AI-drafted wording in our own words: review before
# relying on it, and replace a clause with a rule when one can be written.
  - clause: A.5.1
    title: Information security policies
    text: A set of information security policies is defined, approved by management, published, communicated to staff
      and reviewed at planned intervals.
  - clause: A.5.2
    title: Security roles and responsibilities
    text: Information security roles and responsibilities are defined and allocated to named people.
  - clause: A.5.3
    title: Segregation of duties
    text: Conflicting duties and areas of responsibility are separated so no one person can misuse or alter a process
      alone.
  - clause: A.5.4
    title: Management responsibilities
    text: Management requires all staff to apply information security in line with the organisation's policies and
      procedures.
  - clause: A.5.5
    title: Contact with authorities
    text: The organisation keeps contact with the relevant authorities, such as regulators and law enforcement.
  - clause: A.5.6
    title: Contact with special interest groups
    text: The organisation keeps contact with security forums, professional bodies and similar groups.
  - clause: A.5.7
    title: Threat intelligence
    text: Information about security threats is collected and analysed to produce threat intelligence that is acted
      on.
  - clause: A.5.8
    title: Security in project management
    text: Information security is built into project management, whatever the type of project.
  - clause: A.5.9
    title: Inventory of information and assets
    text: An inventory of information and other associated assets, with their owners, is kept up to date.
  - clause: A.5.10
    title: Acceptable use of information and assets
    text: Rules for acceptable use and handling of information and associated assets are documented and put in place.
  - clause: A.5.11
    title: Return of assets
    text: Staff and other parties return the organisation's assets when their employment, contract or agreement changes
      or ends.
  - clause: A.5.12
    title: Classification of information
    text: Information is classified by its confidentiality, integrity, availability and the needs of interested parties.
  - clause: A.5.13
    title: Labelling of information
    text: Procedures for labelling information follow the organisation's classification scheme.
  - clause: A.5.14
    title: Information transfer
    text: Rules, procedures or agreements cover every kind of information transfer, inside the organisation and with
      others.
  - clause: A.5.16
    title: Identity management
    text: The full life cycle of identities, from creation to removal, is managed.
  - clause: A.5.19
    title: Security in supplier relationships
    text: Processes manage the security risks that come with using suppliers' products and services.
  - clause: A.5.20
    title: Security in supplier agreements
    text: Relevant security requirements are agreed with each supplier according to the kind of relationship.
  - clause: A.5.21
    title: Security in the ICT supply chain
    text: Processes manage the security risks of the ICT products and services supply chain.
  - clause: A.5.22
    title: Monitoring and change of supplier services
    text: Supplier security practices and service delivery are monitored, reviewed, evaluated and changes managed.
  - clause: A.5.23
    title: Security for cloud services
    text: Buying, using, managing and leaving cloud services follow the organisation's security requirements.
  - clause: A.5.24
    title: Incident management planning
    text: Incident management is planned and prepared for, with defined processes, roles and responsibilities.
  - clause: A.5.25
    title: Assessing security events
    text: Security events are assessed and a decision made on whether to treat them as incidents.
  - clause: A.5.27
    title: Learning from incidents
    text: What is learned from security incidents is used to strengthen and improve the controls.
  - clause: A.5.28
    title: Collection of evidence
    text: Procedures exist to identify, collect, acquire and preserve evidence about security events.
  - clause: A.5.29
    title: Security during disruption
    text: The organisation plans how to keep information security at an appropriate level during disruption.
  - clause: A.5.30
    title: ICT readiness for business continuity
    text: ICT readiness is planned, built, maintained and tested against business continuity objectives.
  - clause: A.5.31
    title: Legal, regulatory and contractual requirements
    text: Legal, statutory, regulatory and contractual requirements for information security, and how to meet them,
      are identified, documented and kept current.
  - clause: A.5.32
    title: Intellectual property rights
    text: Procedures protect intellectual property rights.
  - clause: A.5.33
    title: Protection of records
    text: Records are protected from loss, destruction, falsification, unauthorised access and unauthorised release.
  - clause: A.5.34
    title: Privacy and protection of personal data
    text: Requirements for privacy and the protection of personal data are identified and met.
  - clause: A.5.35
    title: Independent review of information security
    text: The approach to information security, including people, processes and technology, is reviewed independently
      at planned intervals or after significant change.
  - clause: A.5.36
    title: Compliance with security policies and standards
    text: Compliance with the security policy, topic-specific policies, rules and standards is reviewed regularly.
  - clause: A.5.37
    title: Documented operating procedures
    text: Operating procedures for information processing facilities are documented and available to the people who
      need them.
  - clause: A.6.1
    title: Screening
    text: Background checks on candidates are carried out before they join, and as needed after, in proportion to
      the risks and the law.
  - clause: A.6.2
    title: Terms and conditions of employment
    text: Employment contracts state the staff member's and the organisation's information security responsibilities.
  - clause: A.6.3
    title: Security awareness, education and training
    text: Staff and relevant other parties receive security awareness, education and training suited to their role,
      with regular updates.
  - clause: A.6.4
    title: Disciplinary process
    text: A disciplinary process, made known to staff, deals with breaches of the information security policy.
  - clause: A.6.5
    title: Responsibilities after termination or change
    text: Security duties that remain after employment ends or changes are defined, communicated and enforced.
  - clause: A.6.6
    title: Confidentiality agreements
    text: Confidentiality or non-disclosure agreements reflect the organisation's needs and are signed, reviewed and
      documented.
  - clause: A.6.7
    title: Remote working
    text: Security measures protect information accessed, processed or stored when people work away from the organisation's
      premises.
  - clause: A.6.8
    title: Reporting security events
    text: Staff have a way to report observed or suspected security events promptly through the right channels.
  - clause: A.7.1
    title: Physical security perimeters
    text: Security perimeters are defined and used to protect areas holding information and associated assets.
  - clause: A.7.2
    title: Physical entry
    text: Secure areas are protected by entry controls and access points.
  - clause: A.7.3
    title: Securing offices, rooms and facilities
    text: Physical security for offices, rooms and facilities is designed and put in place.
  - clause: A.7.4
    title: Physical security monitoring
    text: Premises are monitored continuously for unauthorised physical access.
  - clause: A.7.5
    title: Physical and environmental threats
    text: Protection against physical and environmental threats, such as natural disasters, is designed and put in
      place.
  - clause: A.7.6
    title: Working in secure areas
    text: Security measures for working in secure areas are designed and put in place.
  - clause: A.7.7
    title: Clear desk and clear screen
    text: Clear desk rules for papers and removable media, and clear screen rules for screens, are defined and enforced.
  - clause: A.7.8
    title: Equipment siting and protection
    text: Equipment is sited securely and protected.
  - clause: A.7.9
    title: Security of assets off-premises
    text: Assets used away from the premises are protected.
  - clause: A.7.10
    title: Storage media
    text: Storage media are managed through their life cycle of acquisition, use, transport and disposal, in line
      with classification.
  - clause: A.7.11
    title: Supporting utilities
    text: Information processing facilities are protected from power failures and other disruptions to supporting
      utilities.
  - clause: A.7.12
    title: Cabling security
    text: Power, data and supporting cables are protected from interception, interference or damage.
  - clause: A.7.13
    title: Equipment maintenance
    text: Equipment is maintained correctly so information stays available, intact and confidential.
  - clause: A.7.14
    title: Secure disposal or re-use of equipment
    text: Equipment with storage media is checked so sensitive data and licensed software are removed or securely
      overwritten before disposal or re-use.
  - clause: A.8.1
    title: User endpoint devices
    text: Information stored on, processed by or reachable from user endpoint devices is protected.
  - clause: A.8.3
    title: Information access restriction
    text: Access to information and associated assets is restricted according to the access control policy.
  - clause: A.8.4
    title: Access to source code
    text: Read and write access to source code, development tools and software libraries is managed appropriately.
  - clause: A.8.6
    title: Capacity management
    text: Use of resources is monitored and adjusted against current and expected capacity needs.
  - clause: A.8.7
    title: Protection against malware
    text: Protection against malware is put in place and backed by staff awareness.
  - clause: A.8.8
    title: Management of technical vulnerabilities
    text: Information about technical vulnerabilities is obtained, exposure evaluated and appropriate measures taken.
  - clause: A.8.9
    title: Configuration management
    text: Configurations, including security configurations, of hardware, software, services and networks are set,
      documented, put in place, monitored and reviewed.
  - clause: A.8.11
    title: Data masking
    text: Data masking is used in line with the access control policy, business needs and applicable law.
  - clause: A.8.12
    title: Data leakage prevention
    text: Measures to prevent data leakage apply to systems, networks and devices that handle sensitive information.
  - clause: A.8.14
    title: Redundancy of processing facilities
    text: Information processing facilities have enough redundancy to meet availability requirements.
  - clause: A.8.17
    title: Clock synchronisation
    text: The clocks of information processing systems are synchronised to approved time sources.
  - clause: A.8.18
    title: Privileged utility programs
    text: Use of utility programs that can override system and application controls is restricted and tightly controlled.
  - clause: A.8.19
    title: Installing software on operational systems
    text: Procedures and measures manage the installation of software on operational systems.
  - clause: A.8.20
    title: Network security
    text: Networks and network devices are secured, managed and controlled to protect information in systems and applications.
  - clause: A.8.21
    title: Security of network services
    text: Security mechanisms, service levels and requirements for network services are identified, put in place and
      monitored.
  - clause: A.8.22
    title: Segregation of networks
    text: Groups of information services, users and systems are kept on separate networks.
  - clause: A.8.23
    title: Web filtering
    text: Access to external websites is managed to reduce exposure to malicious content.
  - clause: A.8.25
    title: Secure development life cycle
    text: Rules for the secure development of software and systems are set and applied.
  - clause: A.8.26
    title: Application security requirements
    text: Security requirements are identified, specified and approved when developing or acquiring applications.
  - clause: A.8.27
    title: Secure architecture and engineering
    text: Principles for engineering secure systems are set, documented, maintained and applied to development work.
  - clause: A.8.28
    title: Secure coding
    text: Secure coding principles are applied to software development.
  - clause: A.8.29
    title: Security testing in development and acceptance
    text: Security testing processes are defined and carried out in the development life cycle.
  - clause: A.8.30
    title: Outsourced development
    text: Outsourced system development is directed, monitored and reviewed.
  - clause: A.8.31
    title: Separate development, test and production
    text: Development, testing and production environments are kept apart and secured.
  - clause: A.8.33
    title: Test information
    text: Test information is chosen, protected and managed appropriately.
  - clause: A.8.34
    title: Protection during audit testing
    text: Audit tests and other assurance activities on operational systems are planned and agreed between the tester
      and management.
