framework:
  code: ISO-27001
  version: "2022"

requirements:
  - clause: "A.5.15"
    title: Access control
    text: >
      Rules to control physical and logical access to information and other associated
      assets shall be established and implemented based on business and information
      security requirements.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [approval_date, approver_role, effective_date, systems_covered]
        # ISO expects topic-specific policies to be reviewed at planned intervals.
        # Absent a stated review date, treat an approval older than a year as stale.
        evidence_validity:
          expiry_attribute: next_review_date
          issued_attribute: approval_date
          max_age_days: 365
          required: false
    mappings:
      - uco: UCO-IAM-001
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions: []
      - uco: UCO-IAM-002
        coverage: SUPPORTING
        confidence: 0.9
        source: EXPERT
        delta_conditions: []

  - clause: "A.5.17"
    title: Authentication information
    text: >
      Allocation and management of authentication information shall be controlled by a
      management process, including advising personnel on appropriate handling.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [password_min_length]
    mappings:
      - uco: UCO-IAM-011
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions:
          - attribute: password_min_length
            operator: ">="
            value: 8

  - clause: "A.5.18"
    title: Access rights
    text: >
      Access rights to information and other associated assets shall be provisioned,
      reviewed, modified and removed in accordance with the topic-specific policy on
      access control.
    evidence_requirements:
      - artefact_type: POLICY
        required_attributes: [access_review_frequency_days]
      # The org's own stated cadence is the yardstick — see
      # docs/adr/013-organization-defined-commitments.md.
      - artefact_type: REVIEW_RECORD
        required_attributes: [last_access_review_date]
        evidence_validity:
          issued_attribute: last_access_review_date
          org_defined_max_age_attribute: access_review_frequency_days
          required: true
    mappings:
      - uco: UCO-IAM-020
        coverage: FULL
        confidence: 1.0
        source: EXPERT
        delta_conditions: []
